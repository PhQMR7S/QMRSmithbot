name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests migrations
      - name: Migration script validation
        run: alembic upgrade head --sql > /tmp/qmrsmithbot-migration.sql
      - name: Tests
        run: pytest -q

  runtime-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      AUTH_DEV_BOOTSTRAP_ENABLED: "false"
      TELEGRAM_FACTORY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime without development extras
        run: python -m pip install .
      - name: Exercise packaged application
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/tests/runtime_smoke.py"
