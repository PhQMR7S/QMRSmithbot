name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qmrsmith
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qmrsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://qmrsmith:ci-only-password@localhost:5432/qmrsmith
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install .
      - name: Apply all migrations on PostgreSQL and verify repeatability
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests migrations
      - name: Migration script validation
        run: alembic upgrade head --sql > /tmp/qmrsmithbot-migration.sql
      - name: Tests
        run: pytest -q

  runtime-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      AUTH_DEV_BOOTSTRAP_ENABLED: "false"
      TELEGRAM_FACTORY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime without development extras
        run: python -m pip install .
      - name: Exercise packaged application
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/tests/runtime_smoke.py"
