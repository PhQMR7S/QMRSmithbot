[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "qmrsmithbot"
version = "0.1.0"
description = "Production-grade Telegram Bot Builder platform"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.12,<4",
  "httpx>=0.28,<1",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=6,<7",
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.16.7,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["qmrsmithbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.package-data]
qmrsmithbot = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css"]
