<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMRSmithbot</title><link rel="stylesheet" href="/dashboard/assets/style.css"><script type="module" src="/dashboard/assets/app.js"></script></head><body><aside><strong class="brand">QMRSmithbot</strong><nav aria-label="Navigation"><button data-nav="projects" data-i="projects" class="selected"></button><button data-nav="templates" data-i="templates"></button><button data-nav="settings" data-i="settings"></button></nav></aside><div class="shell"><header><label><span class="sr" data-i="workspace"></span><select id="workspace" disabled></select></label><div class="utilities"><button id="language">English</button><button id="logout" data-i="logout" hidden></button></div></header><main><section id="auth"><h1 data-i="brand"></h1><p data-i="signinInfo"></p><button class="primary" id="login" data-i="login"></button></section><section id="content" hidden><div class="heading"><div><h1 id="title"></h1><p id="subtitle"></p></div><button id="create" class="primary" data-i="create"></button></div><section id="projects"><form id="search"><label class="search"><span class="sr" data-i="search"></span><input id="query" maxlength="120" data-placeholder="search"></label><label><span class="sr" data-i="status"></span><select id="status"><option value="" data-i="all"></option><option value="draft" data-i="draft"></option><option value="running" data-i="running"></option><option value="stopped" data-i="stopped"></option><option value="error" data-i="error"></option></select></label><button type="submit" data-i="searchButton"></button></form><div class="table-wrap"><table><thead><tr><th data-i="name"></th><th data-i="status"></th><th data-i="version"></th><th data-i="actions"></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" data-i="empty" hidden></p><footer><button id="prev" data-i="prev"></button><span id="page"></span><button i
